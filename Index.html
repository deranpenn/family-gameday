<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Family GameDay</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #003087, #ff0000); /* ESPN-ish navy-red */
      color: white;
      font-family: 'Roboto', sans-serif;
      text-align: center;
      overflow-x: hidden;
    }
    header {
      background: rgba(0,0,0,0.6);
      padding: 2rem 1rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 {
      font-family: 'Anton', sans-serif;
      font-size: 4rem;
      margin: 0;
      letter-spacing: 4px;
      text-shadow: 3px 3px 0 #000;
    }
    .tagline {
      font-size: 1.4rem;
      margin-top: 0.5rem;
      opacity: 0.9;
    }
    .video-container {
      max-width: 960px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    video {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 6px solid #fff;
    }
    footer {
      margin: 4rem 0;
      font-size: 0.9rem;
      opacity: 0.7;
    }
    .scorebug {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #000;
      color: #fff;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-family: 'Anton', sans-serif;
      font-size: 1.2rem;
      box-shadow: 0 2px 10px #000;
    }
  </style>
</head>
<body>

  <header>
    <h1>HPH FAMILY GAMEDAY</h1>
    <p class="tagline">Where we root, we record, we replay</p>
  </header>

  <div class="scorebug">HOME 42 - AWAY 17</div>

  <div class="video-container">
    <!-- Replace this src with your video link (YouTube embed or direct MP4) -->
    <video controls autoplay muted loop playsinline>
      <source src="https://your-video-link-here.mp4" type="video/mp4">
      Your browser doesn't support video—upload to YouTube and use an embed instead!
    </video>
  </div>

  <footer>
    <p>Private viewing only. No highlights, no spoilers. Just us.</p>
  </footer>

</body>
</html>
