<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Family GameDay</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #4b0082, #008080); /* Deep purple to teal */
      color: #e0f7fa; /* Light teal-white for text */
      font-family: 'Roboto', sans-serif;
      text-align: center;
      overflow-x: hidden;
    }
    header {
      background: rgba(30, 0, 60, 0.7); /* Dark purple overlay */
      padding: 3rem 1rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    h1 {
      font-family: 'Anton', sans-serif;
      font-size: 6rem;
      margin: 0;
      letter-spacing: 6px;
      text-shadow: 4px 4px 0 #008080; /* Teal glow/shadow */
      color: #00f5d4; /* Bright teal */
    }
    .tagline {
      font-size: 1.5rem;
      margin-top: 0.5rem;
      opacity: 0.9;
      color: #b0e0e6; /* Soft teal */
    }
    .video-container {
      max-width: 960px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    video, iframe {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border: 6px solid #00f5d4; /* Teal border */
    }
    .scorebug {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: #4b0082; /* Purple */
      color: #00f5d4; /* Teal text */
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-family: 'Anton', sans-serif;
      font-size: 1.3rem;
      box-shadow: 0 2px 10px #000;
      border: 2px solid #008080;
    }
    footer {
      margin: 4rem 0;
      font-size: 1rem;
      opacity: 0.8;
      color: #b0e0e6;
    }
    /* Scoreboard container styling to match */
    .scoreboard-container h2 {
      color: #00f5d4;
      text-shadow: 2px 2px #4b0082;
    }
    .scoreboard-container iframe {
      border: 4px solid #00f5d4;
    }
  </style>
</head>
<body>

  <header>
    <h1>FAMILY GAMEDAY</h1>
    <p class="tagline">Where we root, we record, we replay</p>
  </header>

  <div class="scorebug">HOME 42 - AWAY 17</div>

  <div class="video-container">
    <!-- Your video here (MP4 or YouTube embed) -->
    <video controls autoplay muted loop playsinline>
      <source src="https://your-video-link-here.mp4" type="video/mp4">
      Your browser doesn't support video—use YouTube embed instead!
    </video>
    <!-- OR for YouTube: -->
    <!-- <iframe width="100%" height="540" src="https://www.youtube.com/embed/YOUR_VIDEO_ID?autoplay=1&mute=1&loop=1&playlist=YOUR_VIDEO_ID" frameborder="0" allowfullscreen></iframe> -->
  </div>

  <!-- Your live scoreboard (from earlier) -->
  <div class="scoreboard-container" style="max-width: 960px; margin: 2rem auto; padding: 0 1rem;">
    <h2 style="font-family: 'Anton', sans-serif; font-size: 2.5rem; text-shadow: 2px 2px #000; margin-bottom: 1rem;">
      Live College Hoops Action
    </h2>
    <iframe 
      src="https://www.espn.com/mens-college-basketball/scoreboard" 
      width="100%" 
      height="600" 
      frameborder="0" 
      scrolling="yes"
      title="Live NCAA Men's Basketball Scores"
      style="border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.6);">
    </iframe>
    <p style="font-size: 1rem; opacity: 0.8; margin-top: 1rem;">
      Powered by ESPN • Updates in real-time during games
    </p>
  </div>

  <footer>
    <p>Private viewing only. No highlights, no spoilers. Just us.</p>
  </footer>

</body>
</html>
