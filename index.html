<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Family GameDay</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #004d00, #000); /* Green turf to black night */
      color: white;
      font-family: 'Roboto', sans-serif;
      text-align: center;
      overflow-x: hidden;
    }
    header {
      background: rgba(0,0,0,0.8);
      padding: 3rem 1rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
      position: relative;
    }
    h1 {
      font-family: 'Anton', sans-serif;
      font-size: 6rem;
      margin: 0;
      letter-spacing: 6px;
      text-shadow: 4px 4px 0 #ffcc00; /* Gold glow */
      color: #ffcc00;
    }
    .tagline {
      font-size: 1.4rem;
      margin-top: 0.5rem;
      opacity: 0.9;
    }
    .video-container {
      max-width: 960px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    video {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 6px solid #fff;
    }
    footer {
      margin: 4rem 0;
      font-size: 0.9rem;
      opacity: 0.7;
    }
    .scorebug {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #000;
      color: #fff;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-family: 'Anton', sans-serif;
      font-size: 1.2rem;
      box-shadow: 0 2px 10px #000;
    }
  </style>
</head>
<body>

  <header>
    <h1>HPH FAMILY GAMEDAY</h1>
    <p class="tagline">Where we root, we record, we replay</p>
  </header>

</div>

  <div class="video-container">
    <!-- Replace this src with your video link (YouTube embed or direct MP4) -->
    <video controls autoplay muted loop playsinline>
      <source src="https://your-video-link-here.mp4" type="video/mp4">
      Your browser doesn't support video—upload to YouTube and use an embed instead!
    </video>
  </div>

  <footer>
    <p>Private viewing only. No highlights, no spoilers. Just us.</p>
      </footer>
  
 <div class="scoreboard-container" style="max-width: 960px; margin: 2rem auto; padding: 0 1rem;">
  <h2 style="font-family: 'Anton', sans-serif; font-size: 2.5rem; color: #ffcc00; text-shadow: 2px 2px #000; margin-bottom: 1rem;">
    Live College Hoops Action
  </h2>
  <iframe 
    src="https://www.espn.com/mens-college-basketball/scoreboard" 
    width="100%" 
    height="500" 
    frameborder="0" 
    scrolling="yes"
    title="Live NCAA Men's Basketball Scores"
    style="border: 4px solid #ffcc00; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.6);">
  </iframe>
  <p style="font-size: 1rem; opacity: 0.8; margin-top: 1rem;">
    Powered by ESPN • Updates in real-time during games
  </p>
</body>
</html>
